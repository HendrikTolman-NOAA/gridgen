name: Generate Documentation

on:
  push:
    branches: [ main, develop, "feat/*" ]
  pull_request:
    branches: [ main, develop, "feat/*" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: "[Step 1/5] Checkout repository"
        uses: actions/checkout@v4

      - name: "[Step 2/5] Install Doxygen and Graphviz"
        run: |
          echo "[Step 2/5] Installing Doxygen..."
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: "[Step 3/5] Build Doxygen Documentation"
        run: |
          echo "[Step 3/5] Generating Doxygen docs..."
          doxygen Doxyfile

      - name: "[Step 4/5] Disable Jekyll for GitHub Pages"
        run: |
          echo "[Step 4/5] Preparing .nojekyll flag..."
          touch docs/html/.nojekyll

      - name: "[Step 5/5] Upload Artifact for GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "[Step 1/1] Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
