name: CI Workflow

on:
  push:
    branches: [ main, develop, "feat/*" ]
  pull_request:
    branches: [ main, develop, "feat/*" ]
  workflow_dispatch:

jobs:
  build-lint-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: "[Step 1/5] Checkout repository"
        uses: actions/checkout@v4

      - name: "[Step 2/5] Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "[Step 3/5] Install dependencies and editable package (Linking)"
        run: |
          echo "[Step 3/5] Installing dependencies and editable package..."
          python -m pip install --upgrade pip
          pip install -e . pytest ruff

      - name: "[Step 4/5] Lint code with Ruff"
        run: |
          echo "[Step 4/5] Running Ruff linter..."
          ruff check .

      - name: "[Step 5/5] Run unit tests with Pytest"
        run: |
          echo "[Step 5/5] Running Pytest unit tests..."
          pytest
